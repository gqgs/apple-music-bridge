name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests experiments && ruff format --check src tests experiments
      - run: python -X faulthandler -m pytest -v -s tests experiments/release_network
        env:
          QT_QPA_PLATFORM: offscreen
