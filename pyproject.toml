[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-music-bridge"
version = "0.1.0"
description = "A local OpenSubsonic bridge for Apple Music"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
apple-music-bridge = "apple_music_player.cli:main"

[tool.setuptools.package-data]
apple_music_player = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Byte-identical copy of the frozen experiment; adjacent-token zip truncates intentionally.
"src/apple_music_player/release_classifier.py" = ["B905"]
