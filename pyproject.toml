[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-music-player"
version = "0.1.0"
description = "A small native Linux frontend for external Apple Music download and playback tools"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
apple-music-player = "apple_music_player.app:main"

[tool.setuptools.package-data]
apple_music_player = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Byte-identical copy of the frozen experiment; adjacent-token zip truncates intentionally.
"src/apple_music_player/experimental_classifier.py" = ["B905"]
